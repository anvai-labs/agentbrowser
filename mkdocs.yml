site_name: AgentBrowser
site_description: Agent-native browser service for AI agents - semantic observations, stable refs, egress policy, approval gates.
site_url: https://anvai-labs.github.io/agentbrowser/
repo_url: https://github.com/anvai-labs/agentbrowser
edit_uri: edit/develop/docs/
copyright: Copyright &copy; 2026 Anvai Labs

# The repo README stays a repo index; docs/index.md is the published home.
exclude_docs: |
  # Leading slash anchors each pattern to docs/ top level; unanchored
  # gitignore-style patterns match at any depth and would silently drop
  # spec/evidence/, spec/tasks/README.md and spec/design/consumer-*.
  /README.md
  /agent-handoffs/
  /research/
  /evidence/
  /consumer-*.md
  /coexistence-*.md
  /HANDOFF-*.md
  /phase0-summary.md
  /phase1-progress.md
  /hygiene-audit.md

theme:
  name: material
  features:
    - content.tabs.link
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

hooks:
  - docs_hooks/rewrite_source_links.py

plugins:
  - search
  - git-revision-date-localized:
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

