name: CI

# Thrift: docs-only *pushes* to main/develop skip CI (paths-ignore below).
# Pull requests always run the full suite — prose cannot silently break a
# build, but it can stale-link a doc, and PR CI carries the link check.
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/LICENSE' 
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel only obsolete PR candidates. Integration/release pushes keep running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  type-check:
    name: Type Check
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages resolve each other through dist/, which does not
      # exist on a clean checkout. Build first, in topological order.
      - name: Build workspace dependencies
        run: pnpm -r build

      - name: Type check all packages and SDK consumer fault probes
        run: |
          pnpm -r type-check
          node --test scripts/sdk-client-contract.test.mjs

      - name: Verify built product versions
        run: pnpm release:artifacts

  lint:
    name: Lint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm -r lint

      # Prose rots quietly: every relative link in every markdown file must
      # resolve to a real file and a real heading (GitHub-slugified).
      - name: Check documentation links
        run: node scripts/check-doc-links.mjs .

      - name: Check release version consistency
        run: pnpm release:check && pnpm test:release

      - name: Test executable acceptance failures and cleanup
        run: node --test scripts/release-smoke.test.mjs

      - name: Test candidate packaging and acceptance failure controls
        run: node --test scripts/package-server.test.mjs scripts/package-acceptance.test.mjs scripts/application-recipe.test.mjs scripts/application-recipe-lifecycle.test.mjs

      # Offline evidence validation only; does not certify browser containment.
      - name: Check worker feasibility evidence verifier
        run: pnpm test:probes

  test:
    name: Test
    # Native browsers and mapped IPv6 loopback need a qualified Linux host.
    # The org's ubuntu-latest overflow pool also includes restricted containers.
    runs-on: ${{ vars.CI_TEST_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm -r build

      # Share one host-library provisioning step; Firefox itself comes from Mozilla below.
      - name: Install browser system libraries and Chromium
        run: |
          pnpm --filter @agentbrowser/engine-playwright exec playwright install-deps chromium firefox
          pnpm --filter @agentbrowser/engine-playwright exec playwright install chromium

      # One cached Firefox qualification in this existing job, no browser matrix.
      - name: Cache native Firefox
        uses: actions/cache@v4
        with:
          path: .cache/firefox
          key: firefox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/engine-firefox/scripts/browser-config.mjs') }}

      - name: Install pinned native Firefox
        run: node packages/engine-firefox/scripts/install.mjs --github-env

      - name: Run tests
        # Bound both scheduler layers: parallel packages each spawning a full
        # Vitest pool can starve native browser startup on shared runners.
        run: |
          pnpm exec biome check scripts/probe-journal-sqlite.mjs
          node scripts/probe-journal-sqlite.mjs
          pnpm test:job-eligibility
          pnpm -r --workspace-concurrency=1 run test --maxWorkers=2 --minWorkers=1

      - name: Qualify Firefox production dependency independence
        run: |
          node --test scripts/firefox-deployment-audit.test.mjs
          pnpm test:egress-evidence
          pnpm test:firefox-independence

      - name: Qualify application production dependency independence
        run: |
          node --test scripts/application-deployment-audit.test.mjs
          pnpm test:application-independence

      - name: Upload coverage
        if: hashFiles('coverage/coverage-final.json') != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json

  build:
    name: Build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [type-check, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

  docker:
    name: Docker
    # Docker needs an available daemon, not just a generic Linux/WSL label.
    # A repo override can reuse qualified self-hosted capacity.
    runs-on: ${{ vars.CI_DOCKER_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t agentbrowser:${{ github.sha }} .

      - name: Run read-only smoke test
        run: |
          CONTAINER_ID=$(docker run -d \
            --read-only \
            --tmpfs /tmp \
            agentbrowser:${{ github.sha }})
          trap 'docker rm -f "$CONTAINER_ID" >/dev/null' EXIT
          RUNTIME_NODE=$(docker exec "$CONTAINER_ID" node --version)
          case "$RUNTIME_NODE" in
            v24.*) ;;
            *) echo "unexpected production Node runtime: $RUNTIME_NODE" >&2; exit 1 ;;
          esac
          for _ in $(seq 1 30); do
            if docker exec "$CONTAINER_ID" node -e "Promise.all(['live','ready'].map(async p=>{const r=await fetch('http://127.0.0.1:5709/health/'+p,{signal:AbortSignal.timeout(1000)});if(!r.ok)throw Error(p);return r.json()})).then(r=>console.log(JSON.stringify(r))).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 2
          done
          echo "container never became live"
          docker logs "$CONTAINER_ID"
          exit 1

  benchmarks:
    name: Benchmarks
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm -r build

      # Release gates: latency targets, 45/50 deterministic tasks, clean soak.
      - name: Run benchmark suite
        run: pnpm --filter @agentbrowser/benchmarks all 1000

      - name: Install Playwright browsers
        run: pnpm --filter @agentbrowser/engine-playwright exec playwright install --with-deps chromium

      # ADR-010 gate data: real Chromium vs the deterministic engine on
      # local fixture pages. Gates the (deterministic) ref-loop success.
      - name: Comparative benchmark (real Chromium)
        run: pnpm bench:real

  # Spec §17.2 backend #3: Obscura (experimental). The pinned binary is
  # fetched with SHA-256 verification, which activates the env-gated
  # suites. Smoke + contract gate our launcher/adapter; the egress suite
  # encodes the probe-verified v0.2.1 network gap (denials not enforced:
  # two tests skip with the gap named, and a truth guard asserts the
  # current behavior - it flips red if upstream starts honoring
  # Fetch.fulfillRequest, prompting the skips' removal). The comparative
  # benchmark stays Chromium-gated; Obscura rows are informational and
  # appear in local bench:real runs when the binary is present.
  obscura:
    name: Obscura (experimental)
    # The shared ubuntu-latest label also selects WSL/container overflow workers,
    # where this native binary has not qualified. Override only with a vetted host.
    runs-on: ${{ vars.CI_OBSCURA_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm -r build

      - name: Cache Obscura binary
        uses: actions/cache@v4
        with:
          path: .cache/obscura
          key: obscura-v0.2.1-linux-x64

      - name: Fetch pinned Obscura binary (SHA-256 verified)
        run: node packages/engine-obscura/scripts/fetch.mjs

      - name: Smoke + contract + egress suites
        run: pnpm --filter @agentbrowser/engine-obscura test

  # TD-BROWSER-5: a change that breaks single-binary bundling (a new dynamic
  # import, a node-only API, a dependency regression) must fail the PR that
  # introduced it, not the release tag.
  bun-compile:
    name: Bun compile + smoke
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm -r build

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match the release workflow's build environment.
          bun-version: '1.4.0'

      - name: Compile the MCP server binary (version-stamped)
        run: node packages/mcp-server/scripts/compile.mjs

      - name: Native Bun download HTTP/TLS acceptance
        run: bun scripts/check-download-bun.ts

      - name: Stdio smoke (initialize + tools/list)
        run: node packages/mcp-server/scripts/smoke.mjs packages/mcp-server/dist-bin/agentbrowser-mcp

      - name: Compile the CLI for packaged workflow acceptance
        run: node packages/cli/scripts/compile.mjs

      - name: Install Chromium system dependencies on Linux
        if: runner.os == 'Linux'
        run: pnpm --filter @agentbrowser/engine-playwright exec playwright install-deps chromium

      - name: Install the acceptance-only PDF parser
        run: |
          if ! command -v qpdf >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update && sudo apt-get install -y qpdf
            else
              HOMEBREW_NO_AUTO_UPDATE=1 brew install qpdf
            fi
          fi
          qpdf --version

      - name: Test malformed capture rejection with the PDF parser
        run: node --test scripts/artifact-validation.test.mjs

      - name: Package the untagged server candidate
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TARGET="$(node -p "process.platform + '-' + process.arch")"
          node scripts/package-server.mjs --output-dir out-packages --target "$TARGET" --expected-version "$VERSION"

      - name: Accept the extracted candidate with real Chromium and client binaries
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/candidate-browsers
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TARGET="$(node -p "process.platform + '-' + process.arch")"
          EXTRACTED="$(mktemp -d "$RUNNER_TEMP/agentbrowser-candidate.XXXXXX")"
          trap 'rm -rf -- "$EXTRACTED"' EXIT
          tar -xzf "out-packages/agentbrowser-server-$TARGET.tar.gz" -C "$EXTRACTED"
          node scripts/package-acceptance.mjs --server-root "$EXTRACTED/server" --expected-version "$VERSION" --expected-commit "$GITHUB_SHA" \
            --cli "$GITHUB_WORKSPACE/packages/cli/dist-bin/agentbrowser" \
            --mcp "$GITHUB_WORKSPACE/packages/mcp-server/dist-bin/agentbrowser-mcp" --install-browser
