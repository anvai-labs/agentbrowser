name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Workspace packages resolve each other through dist/, which does not
      # exist on a clean checkout. Build first, in topological order.
      - name: Build workspace dependencies
        run: pnpm -r build

      - name: Type check all packages
        run: pnpm -r type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Biome
        run: pnpm -r lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build workspace dependencies
        run: pnpm -r build

      # engine-playwright drives a real Chromium.
      - name: Install Playwright browsers
        run: pnpm --filter @agentbrowser/engine-playwright exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm -r test

      - name: Upload coverage
        if: hashFiles('coverage/coverage-final.json') != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [type-check, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm -r build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t agentbrowser:${{ github.sha }} .

      - name: Run read-only smoke test
        run: |
          docker run -d --rm \
            --name agentbrowser-smoke \
            --read-only \
            --tmpfs /tmp \
            -p 3000:3000 \
            agentbrowser:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health/live > /dev/null; then
              echo "liveness OK"
              curl -sf http://127.0.0.1:3000/health/ready | head -c 200
              echo
              docker stop agentbrowser-smoke
              exit 0
            fi
            sleep 2
          done
          echo "container never became live"
          docker logs agentbrowser-smoke
          docker stop agentbrowser-smoke || true
          exit 1
