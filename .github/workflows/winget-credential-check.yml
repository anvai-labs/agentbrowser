# Proves, without a release, that CI can mint the winget App token the release
# workflow needs. Read-only: it names the App behind WINGET_APP_ID, then checks
# that the App's installation covers anvai-labs/winget-pkgs with write access.
# Fail closed: a masked exit, a missing secret, or a token without push access
# each end the check red with the remedy in the error.
name: Winget credential check

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - .github/workflows/winget-credential-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Identify the App and every installation it has (App JWT; prints no key material)
        env:
          APP_ID: ${{ secrets.WINGET_APP_ID }}
          APP_KEY: ${{ secrets.WINGET_APP_PRIVATE_KEY }}
        run: |
          set -o pipefail
          node - <<'JS' | tee -a "$GITHUB_STEP_SUMMARY"
          const { createSign } = require('node:crypto');
          const appId = process.env.APP_ID ?? '';
          const rawKey = process.env.APP_KEY ?? '';
          if (!appId.trim() || !rawKey.trim()) {
            console.log('WINGET_APP_ID/WINGET_APP_PRIVATE_KEY are missing or empty (fork PRs cannot see secrets, or they were removed or renamed). The release winget job would degrade to a manifest artifact.');
            process.exit(1);
          }
          // The token action tolerates PEMs stored with literal \n escapes;
          // the diagnostic must accept everything the thing it diagnoses does.
          const key = rawKey.includes('\\n') ? rawKey.replace(/\\n/g, '\n') : rawKey;
          const b64 = (v) => Buffer.from(JSON.stringify(v)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const head = b64({ alg: 'RS256', typ: 'JWT' });
          const body = b64({ iat: now - 60, exp: now + 540, iss: appId.trim() });
          let sig;
          try {
            sig = createSign('RSA-SHA256').update(`${head}.${body}`).sign(key, 'base64url');
          } catch {
            console.log('WINGET_APP_PRIVATE_KEY is not a usable RSA private key (the App JWT could not be signed). Re-copy the PEM exactly as the App settings show it.');
            process.exit(1);
          }
          const jwt = `${head}.${body}.${sig}`;
          const get = async (path) => {
            const r = await fetch(`https://api.github.com${path}`, {
              headers: { authorization: `Bearer ${jwt}`, accept: 'application/vnd.github+json' },
            });
            return { status: r.status, json: await r.json() };
          };
          (async () => {
            const app = await get('/app');
            if (app.status !== 200) { console.log(`App JWT refused: HTTP ${app.status} (${app.json.message})`); process.exit(1); }
            console.log(`\n**App:** \`${app.json.slug}\` (id ${app.json.id}, owner ${app.json.owner?.login}); permissions ${JSON.stringify(app.json.permissions)}\n`);
            const inst = await get('/app/installations');
            if (inst.status !== 200) { console.log(`Installations listing refused: HTTP ${inst.status} (${inst.json.message})`); process.exit(1); }
            console.log(`**Installations (${inst.json.length}):**\n`);
            for (const i of inst.json) console.log(`- ${i.account.login} (${i.target_type}), repository_selection=${i.repository_selection}, permissions=${JSON.stringify(i.permissions)}`);
            if (inst.json.length === 0) console.log('- none: the App is not installed anywhere');
          })();
          JS

      - name: Org-level token (names the App)
        id: org
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.WINGET_APP_ID }}
          private-key: ${{ secrets.WINGET_APP_PRIVATE_KEY }}
          owner: anvai-labs

      - name: Token for anvai-labs/winget-pkgs (what release.yml needs)
        id: fork
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.WINGET_APP_ID }}
          private-key: ${{ secrets.WINGET_APP_PRIVATE_KEY }}
          owner: anvai-labs
          repositories: winget-pkgs

      - name: Report
        env:
          ORG_OUTCOME: ${{ steps.org.outcome }}
          APP_SLUG: ${{ steps.org.outputs.app-slug }}
          ORG_TOKEN: ${{ steps.org.outputs.token }}
          FORK_OUTCOME: ${{ steps.fork.outcome }}
          FORK_TOKEN: ${{ steps.fork.outputs.token }}
        run: |
          set -o pipefail
          {
            echo "### Winget credential check"
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| App behind WINGET_APP_ID | \`${APP_SLUG:-unknown}\` (org token: ${ORG_OUTCOME}) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ORG_TOKEN" ]; then
            count=$(GH_TOKEN="$ORG_TOKEN" gh api installation/repositories --jq '.total_count' 2>/dev/null || echo "?")
            repos=$(GH_TOKEN="$ORG_TOKEN" gh api --paginate installation/repositories --jq '.repositories[].full_name' 2>/dev/null | sort -u | paste -sd, - || echo "?")
            echo "| Repositories the installation covers (${count}) | ${repos} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$FORK_OUTCOME" = success ] && [ -n "$FORK_TOKEN" ]; then
            push=$(GH_TOKEN="$FORK_TOKEN" gh api repos/anvai-labs/winget-pkgs --jq '.permissions.push | if . == true then "true" elif . == false then "false" else "absent" end' 2>/dev/null || echo "api-error")
            echo "| Token for anvai-labs/winget-pkgs | ✔ minted (push: ${push}) |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$push" = true ]; then
              echo "PASS: CI can mint the winget-pkgs token with push access."
            else
              echo "::error::The winget-pkgs token minted but push=${push}. Grant the App's installation contents:write on anvai-labs/winget-pkgs (installation access, not the App's base permissions)."
              exit 1
            fi
          else
            echo "| Token for anvai-labs/winget-pkgs | ✖ not minted: install the App on anvai-labs/winget-pkgs |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The App behind WINGET_APP_ID (${APP_SLUG:-unknown}) has no installation covering anvai-labs/winget-pkgs. Add the repository to the App's installation."
            exit 1
          fi
