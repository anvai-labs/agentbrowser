# Proves, without a release, that CI can mint the winget App token the release
# workflow needs. Read-only: it names the App behind WINGET_APP_ID, then checks
# that the App's installation covers anvai-labs/winget-pkgs with write access.
name: Winget credential check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/winget-credential-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Identify the App and every installation it has (App JWT; prints no key material)
        env:
          APP_ID: ${{ secrets.WINGET_APP_ID }}
          APP_KEY: ${{ secrets.WINGET_APP_PRIVATE_KEY }}
        run: |
          node - <<'JS' | tee -a "$GITHUB_STEP_SUMMARY"
          const { createSign } = require('node:crypto');
          const b64 = (v) => Buffer.from(JSON.stringify(v)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const head = b64({ alg: 'RS256', typ: 'JWT' });
          const body = b64({ iat: now - 60, exp: now + 540, iss: process.env.APP_ID.trim() });
          const sig = createSign('RSA-SHA256').update(`${head}.${body}`).sign(process.env.APP_KEY, 'base64url');
          const jwt = `${head}.${body}.${sig}`;
          const get = async (path) => {
            const r = await fetch(`https://api.github.com${path}`, {
              headers: { authorization: `Bearer ${jwt}`, accept: 'application/vnd.github+json' },
            });
            return { status: r.status, json: await r.json() };
          };
          (async () => {
            const app = await get('/app');
            if (app.status !== 200) { console.log(`App JWT refused: HTTP ${app.status} (${app.json.message})`); process.exit(1); }
            console.log(`\n**App:** \`${app.json.slug}\` (id ${app.json.id}, owner ${app.json.owner?.login}); permissions ${JSON.stringify(app.json.permissions)}\n`);
            const inst = await get('/app/installations');
            console.log(`**Installations (${inst.json.length}):**\n`);
            for (const i of inst.json) console.log(`- ${i.account.login} (${i.target_type}), repository_selection=${i.repository_selection}, permissions=${JSON.stringify(i.permissions)}`);
            if (inst.json.length === 0) console.log('- none: the App is not installed anywhere');
          })();
          JS

      - name: Org-level token (names the App)
        id: org
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.WINGET_APP_ID }}
          private-key: ${{ secrets.WINGET_APP_PRIVATE_KEY }}
          owner: anvai-labs

      - name: Token for anvai-labs/winget-pkgs (what release.yml needs)
        id: fork
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.WINGET_APP_ID }}
          private-key: ${{ secrets.WINGET_APP_PRIVATE_KEY }}
          owner: anvai-labs
          repositories: winget-pkgs

      - name: Report
        env:
          ORG_OUTCOME: ${{ steps.org.outcome }}
          APP_SLUG: ${{ steps.org.outputs.app-slug }}
          ORG_TOKEN: ${{ steps.org.outputs.token }}
          FORK_OUTCOME: ${{ steps.fork.outcome }}
          FORK_TOKEN: ${{ steps.fork.outputs.token }}
        run: |
          {
            echo "### Winget credential check"
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| App behind WINGET_APP_ID | \`${APP_SLUG:-unknown}\` (org token: ${ORG_OUTCOME}) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ORG_TOKEN" ]; then
            repos=$(GH_TOKEN="$ORG_TOKEN" gh api installation/repositories --jq '[.repositories[].full_name] | join(", ")' 2>/dev/null || echo "?")
            echo "| Repositories the installation covers | ${repos} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$FORK_OUTCOME" = success ] && [ -n "$FORK_TOKEN" ]; then
            push=$(GH_TOKEN="$FORK_TOKEN" gh api repos/anvai-labs/winget-pkgs --jq '.permissions.push // "n/a"' 2>/dev/null || echo "?")
            echo "| Token for anvai-labs/winget-pkgs | ✔ minted (push: ${push}) |" >> "$GITHUB_STEP_SUMMARY"
            echo "PASS: CI can mint the winget-pkgs token."
          else
            echo "| Token for anvai-labs/winget-pkgs | ✖ not minted: install the App on anvai-labs/winget-pkgs |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The App behind WINGET_APP_ID (${APP_SLUG:-unknown}) has no installation covering anvai-labs/winget-pkgs. Add the repository to the App's installation."
            exit 1
          fi
