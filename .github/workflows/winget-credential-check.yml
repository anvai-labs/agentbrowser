# Proves, without a release, that CI can mint the winget App token the release
# workflow needs. Read-only: it names the App behind WINGET_APP_ID, then checks
# that the App's installation covers anvai-labs/winget-pkgs with write access.
name: Winget credential check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/winget-credential-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Org-level token (names the App)
        id: org
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.WINGET_APP_ID }}
          private-key: ${{ secrets.WINGET_APP_PRIVATE_KEY }}
          owner: anvai-labs

      - name: Token for anvai-labs/winget-pkgs (what release.yml needs)
        id: fork
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.WINGET_APP_ID }}
          private-key: ${{ secrets.WINGET_APP_PRIVATE_KEY }}
          owner: anvai-labs
          repositories: winget-pkgs

      - name: Report
        env:
          ORG_OUTCOME: ${{ steps.org.outcome }}
          APP_SLUG: ${{ steps.org.outputs.app-slug }}
          ORG_TOKEN: ${{ steps.org.outputs.token }}
          FORK_OUTCOME: ${{ steps.fork.outcome }}
          FORK_TOKEN: ${{ steps.fork.outputs.token }}
        run: |
          {
            echo "### Winget credential check"
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| App behind WINGET_APP_ID | \`${APP_SLUG:-unknown}\` (org token: ${ORG_OUTCOME}) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ORG_TOKEN" ]; then
            repos=$(GH_TOKEN="$ORG_TOKEN" gh api installation/repositories --jq '[.repositories[].full_name] | join(", ")' 2>/dev/null || echo "?")
            echo "| Repositories the installation covers | ${repos} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$FORK_OUTCOME" = success ] && [ -n "$FORK_TOKEN" ]; then
            push=$(GH_TOKEN="$FORK_TOKEN" gh api repos/anvai-labs/winget-pkgs --jq '.permissions.push // "n/a"' 2>/dev/null || echo "?")
            echo "| Token for anvai-labs/winget-pkgs | ✔ minted (push: ${push}) |" >> "$GITHUB_STEP_SUMMARY"
            echo "PASS: CI can mint the winget-pkgs token."
          else
            echo "| Token for anvai-labs/winget-pkgs | ✖ not minted: install the App on anvai-labs/winget-pkgs |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The App behind WINGET_APP_ID (${APP_SLUG:-unknown}) has no installation covering anvai-labs/winget-pkgs. Add the repository to the App's installation."
            exit 1
          fi
