name: Release

# Single-binary MCP distribution per TD-BROWSER-5: every v* tag builds the
# agentbrowser-mcp executable for five targets, smoke-gates the artifacts that
# can run on their build runner, and publishes them with checksums.
on:
  push:
    tags: ['v*']

# Least privilege (T9 S1c): read by default; only the release job writes contents.
permissions:
  contents: read

jobs:
  tag-guard:
    name: Tag matches package version
    runs-on: ubuntu-latest
    steps:
      # Full history: the ancestry check below compares the tag commit with main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.tool-versions'

      # The root product version owns every manifest and generated runtime stamp.
      - name: Verify tag and first-party versions
        run: node scripts/sync-versions.mjs --tag "$GITHUB_REF_NAME"

      # T9 S1a / R14: only tags cut from main publish. Every building and
      # publishing job depends on this job, directly or through binaries.
      - name: Verify the tag commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/check-tag-ancestry.mjs --commit "$GITHUB_SHA" --main-ref origin/main

  binaries:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    needs: tag-guard
    strategy:
      fail-fast: false
      matrix:
        # smoke: whether the artifact can be executed on its build runner.
        # Cross-compiled targets that cannot run there are recorded in the
        # release notes instead of being silently skipped.
        include:
          - target: bun-darwin-arm64
            os: macos-latest
            artifact: agentbrowser-mcp-darwin-arm64
            cli_artifact: agentbrowser-cli-darwin-arm64
            smoke: true
          # GitHub retired the Intel macOS runners: the x64 build is
          # cross-compiled on the arm64 runner and smoke-tested through Rosetta.
          - target: bun-darwin-x64
            os: macos-latest
            artifact: agentbrowser-mcp-darwin-x64
            cli_artifact: agentbrowser-cli-darwin-x64
            smoke: true
          - target: bun-linux-x64
            os: ubuntu-latest
            artifact: agentbrowser-mcp-linux-x64
            cli_artifact: agentbrowser-cli-linux-x64
            smoke: true
          # Same native ARM runner already used by server packaging.
          - target: bun-linux-arm64
            os: ubuntu-24.04-arm
            artifact: agentbrowser-mcp-linux-arm64
            cli_artifact: agentbrowser-cli-linux-arm64
            smoke: true
          - target: bun-windows-x64
            os: windows-latest
            artifact: agentbrowser-mcp-windows-x64.exe
            cli_artifact: agentbrowser-cli-windows-x64.exe
            smoke: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages resolve each other through dist/; a clean checkout
      # has none. Same shape as the CI build job.
      - name: Build workspace dependencies
        run: pnpm -r build

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: the bun version is part of the build environment and is
          # recorded in the release notes. Bump deliberately, then re-verify.
          bun-version: '1.4.0'

      - name: Compile the binary (version-stamped)
        run: node packages/mcp-server/scripts/compile.mjs --target=${{ matrix.target }} --outfile=packages/mcp-server/dist-bin/${{ matrix.artifact }}

      - name: Stdio smoke (initialize + tools/list)
        if: ${{ matrix.smoke }}
        run: node packages/mcp-server/scripts/smoke.mjs packages/mcp-server/dist-bin/${{ matrix.artifact }}

      - name: Record the skipped smoke in the job log
        if: ${{ !matrix.smoke }}
        run: echo "::warning::Smoke SKIPPED for ${{ matrix.artifact }} - cross-compiled for a target with no runner. Recorded in the release notes."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: packages/mcp-server/dist-bin/${{ matrix.artifact }}
          if-no-files-found: error

      # The CLI rides the same matrix/targets (Phase 3): its only deps are
      # commander + the fetch-only SDK, both bundle-clean. Previously the
      # CLI was unreachable except from a repo checkout - brew shipped only
      # the MCP binary and the server wrapper, and the package is private.
      - name: Compile the CLI binary
        run: node packages/cli/scripts/compile.mjs --target=${{ matrix.target }} --outfile=packages/cli/dist-bin/${{ matrix.cli_artifact }}

      - name: CLI smoke (version + help)
        if: ${{ matrix.smoke }}
        run: node packages/cli/scripts/smoke.mjs packages/cli/dist-bin/${{ matrix.cli_artifact }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.cli_artifact }}
          path: packages/cli/dist-bin/${{ matrix.cli_artifact }}
          if-no-files-found: error

  # The Windows service ships as one zip: the launcher, the exact CLI/MCP
  # executables built above, a pinned official Node runtime and the
  # lockfile-faithful server tree. A single-file server exe cannot work —
  # Playwright is bundler-hostile, and v1.17.0's Bun-compiled exe froze its
  # __dirname lookups to the CI checkout. Assembled and clean-room smoked on
  # a hosted Windows runner, outside the checkout, before anything publishes.
  windows-bundle:
    name: Windows bundle
    runs-on: windows-latest
    needs: [tag-guard, binaries]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm -r build

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Same pin as the binaries job: part of the build environment.
          bun-version: '1.4.0'

      # The bundle carries the same bytes as the standalone release assets.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/win-exes
          pattern: agentbrowser-*-windows-x64.exe
          merge-multiple: true

      - name: Provision Chromium for the smoke
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:RUNNER_TEMP\bundle-browsers"
          pnpm --filter @agentbrowser/engine-playwright exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PLAYWRIGHT_BROWSERS_PATH=$env:PLAYWRIGHT_BROWSERS_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package the win32-x64 server tree
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/package-server.mjs --output-dir (Join-Path $env:RUNNER_TEMP 'win32-server') --target win32-x64 --expected-version $version --commit $env:GITHUB_SHA
          exit $LASTEXITCODE

      - name: Assemble the Windows bundle
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exes = Join-Path $env:RUNNER_TEMP 'win-exes'
          $launcher = Join-Path $env:RUNNER_TEMP 'launcher\agentbrowser-server.exe'
          # One string per argument: pwsh splits `--outfile=(expr)` into two.
          node packages/api/scripts/compile-launcher.mjs --target=bun-windows-x64 "--outfile=$launcher"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/assemble-windows-bundle.mjs --output-dir (Join-Path $env:RUNNER_TEMP 'win-bundle') --expected-version $version `
            --server-zip (Join-Path $env:RUNNER_TEMP 'win32-server\agentbrowser-server-win32-x64.zip') --launcher $launcher `
            --cli (Join-Path $exes 'agentbrowser-cli-windows-x64.exe') --mcp (Join-Path $exes 'agentbrowser-mcp-windows-x64.exe')
          exit $LASTEXITCODE

      - name: Clean-room Windows bundle smoke
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $room = Join-Path $env:RUNNER_TEMP 'clean-room'
          New-Item -ItemType Directory $room -Force | Out-Null
          Copy-Item scripts/windows-bundle-smoke.mjs, scripts/windows-mcp-e2e.test.mjs $room
          Set-Location $room
          node windows-bundle-smoke.mjs --zip (Join-Path $env:RUNNER_TEMP 'win-bundle\agentbrowser-windows-x64.zip') `
            --expected-version $version --browsers $env:PLAYWRIGHT_BROWSERS_PATH --require-symlink
          exit $LASTEXITCODE

      # Once per release, the path users actually take: no provisioned
      # browsers, so the launcher's first start downloads Chromium itself.
      - name: Clean-room smoke with a first-start Chromium download
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Set-Location (Join-Path $env:RUNNER_TEMP 'clean-room')
          Remove-Item Env:PLAYWRIGHT_BROWSERS_PATH
          node windows-bundle-smoke.mjs --zip (Join-Path $env:RUNNER_TEMP 'win-bundle\agentbrowser-windows-x64.zip') `
            --expected-version $version --require-symlink
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentbrowser-windows-x64.zip
          path: ${{ runner.temp }}/win-bundle/agentbrowser-windows-x64.zip
          if-no-files-found: error

  server-packages:
    needs: [tag-guard, binaries]
    # TD-BROWSER-5 shipped only the MCP adapter; consumers still needed a repo
    # checkout for the service it drives. Each target is a self-contained
    # "fat tarball": the built API server plus its pruned production
    # node_modules (Playwright is bundler-hostile — its package tree must ship
    # intact, so no esbuild/bun single-file trick here). The same packager and
    # real-browser harness run pre-tag in PR CI. Darwin x64 server execution
    # here uses ARM Node; the matching client binaries execute through Rosetta.
    name: Server ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
          - target: darwin-x64
            # The fat tarball is pure JS plus a universal optional fsevents —
            # no arch-specific build step — and macos-13 runners starve
            # (see sandhi's release.yml). Build x64 on the arm64 runner.
            os: macos-latest
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      - name: Package the versioned server
        run: node scripts/package-server.mjs --output-dir out-packages --target "${{ matrix.target }}" --expected-version "${GITHUB_REF_NAME#v}"

      - name: Install Chromium system dependencies on Linux
        if: runner.os == 'Linux'
        run: pnpm --filter @agentbrowser/engine-playwright exec playwright install-deps chromium

      - name: Install the acceptance-only PDF parser
        run: |
          if ! command -v qpdf >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update && sudo apt-get install -y qpdf
            else
              HOMEBREW_NO_AUTO_UPDATE=1 brew install qpdf
            fi
          fi
          qpdf --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentbrowser-cli-${{ matrix.target }}
          path: out-clients

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentbrowser-mcp-${{ matrix.target }}
          path: out-clients

      - name: Accept the extracted release package with its matching clients
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/release-browsers
        run: |
          EXTRACTED="$(mktemp -d "$RUNNER_TEMP/agentbrowser-release.XXXXXX")"
          trap 'rm -rf -- "$EXTRACTED"' EXIT
          tar -xzf "out-packages/agentbrowser-server-${{ matrix.target }}.tar.gz" -C "$EXTRACTED"
          chmod +x "out-clients/agentbrowser-cli-${{ matrix.target }}" "out-clients/agentbrowser-mcp-${{ matrix.target }}"
          node scripts/package-acceptance.mjs --server-root "$EXTRACTED/server" --expected-version "${GITHUB_REF_NAME#v}" --expected-commit "$GITHUB_SHA" \
            --cli "$GITHUB_WORKSPACE/out-clients/agentbrowser-cli-${{ matrix.target }}" \
            --mcp "$GITHUB_WORKSPACE/out-clients/agentbrowser-mcp-${{ matrix.target }}" --install-browser

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.target }}
          path: out-packages/agentbrowser-server-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  npm-publish:
    name: npm (@anvailabs/agentbrowser-mcp)
    # Publication must not race ahead of failed executable or packaged-server smoke.
    needs: [tag-guard, binaries, server-packages, windows-bundle]
    # Hosted-only label: org self-hosted runners advertise ubuntu-latest, and
    # npm rejects provenance bundles minted on self-hosted runners (E422).
    runs-on: ubuntu-24.04
    # OIDC Trusted Publishing (ADR-014): the npm binding pins (repository
    # anvai-labs/agentbrowser, workflow release.yml, environment npm) — no
    # publish token exists anywhere to leak or rotate. id-token: write mints
    # the assertion; npm >= 11 speaks OIDC natively. The tarball is packed
    # with pnpm because the package carries workspace:* internal deps that
    # plain npm cannot resolve at pack time.
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.tool-versions'
          registry-url: 'https://registry.npmjs.org'
      - name: Build (package + its workspace dependencies)
        run: pnpm install --frozen-lockfile && pnpm --filter @anvailabs/agentbrowser-mcp... build
      - name: Publish with npm (OIDC) — skip if this version is already on the registry
        # The bootstrap publish (bridging the Trusted-Publisher chicken-and-egg)
        # puts the first version up from a local token; a re-run or subsequent
        # release flow must not die on "already published" (same idempotency as
        # the crates job in the sibling repo).
        #
        # ADR-014: OIDC trusted publishing ONLY, via the documented
        # invocation: `npm publish --provenance` from the package directory
        # with NO other credential configured. The v1.7.1 failure ladder:
        # take 1 E404 — a stale ambient NODE_AUTH_TOKEN (injected from
        # outside the workflow; repo/env/org secret lists are empty) was
        # preferred by npm over OIDC and is dead. Take 2 ENEEDAUTH — token
        # emptied, but setup-node's .npmrc still carried `_authToken=`
        # (configured-but-empty ≠ absent). Take 3 ENEEDAUTH — userconfig
        # neutralized so zero auth existed, which proved npm never
        # auto-attempts the OIDC exchange on a bare publish: `--provenance`
        # is what enters the trusted-publisher flow, and with id-token: write
        # and no other credential the OIDC exchange IS the authentication.
        # The earlier pnpm-pack-then-publish-tarball flow is dropped:
        # provenance publishes from the package directory, and the package
        # has zero runtime deps (esbuild bundles everything into dist/), so
        # nothing needs workspace:* resolution at publish time.
        working-directory: packages/mcp-server
        env:
          NODE_AUTH_TOKEN: ''
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if curl -sf -A "agentbrowser-release" \
            "https://registry.npmjs.org/@anvailabs%2fagentbrowser-mcp" \
            | grep -q "\"${VERSION}\""; then
            echo "::notice::$VERSION already on npm — skipping publish (verify still runs)"
          else
            npm publish --access public --provenance
          fi
      - name: Verify the registry actually has this version
        # Enforced, never token-keyed (the sibling repo's lesson): check the
        # artifact, not the job's exit code. npm's own post-publish notice says
        # the version "may take a few minutes to become available" — the
        # original 6x20s (~2 min) window was shorter than real indexing lag in
        # three releases (v1.8.8, v1.8.9, v1.8.12), failing the job after a
        # SUCCESSFUL publish and skipping the GitHub Release downstream. 20x30s
        # (~10 min) rides out the lag; on a genuine miss, re-running this job
        # is safe because the publish step above skips existing versions.
        # jq (preinstalled on the runner) checks the exact version KEY in the
        # registry document instead of a substring grep.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          START="$(date +%s)"
          for attempt in $(seq 1 20); do
            DOC="$(mktemp)"
            if curl -sf -A "agentbrowser-release" \
              "https://registry.npmjs.org/@anvailabs%2fagentbrowser-mcp" -o "$DOC" \
              && jq -e --arg v "$VERSION" '.versions[$v] != null' "$DOC" >/dev/null; then
              LATEST="$(jq -r '.["dist-tags"].latest // "unknown"' "$DOC")"
              rm -f "$DOC"
              echo "npm: @anvailabs/agentbrowser-mcp ${VERSION} live (latest=${LATEST}, waited $(( $(date +%s) - START ))s)"
              exit 0
            fi
            rm -f "$DOC"
            echo "not visible yet (attempt ${attempt}/20, $(( $(date +%s) - START ))s elapsed); registry indexing lag"
            sleep 30
          done
          echo "::error::npm publish reported success but ${VERSION} is not on the registry after 10 minutes"
          echo "::error::If the version is actually live (check registry.npmjs.org), re-run this failed job — the publish step skips versions already on the registry."
          exit 1

  release:
    # attestations + id-token: signed build provenance for every published asset (R14).
    permissions:
      attestations: write
      contents: write
      id-token: write
    name: Checksums and GitHub Release
    # Hosted-only: publication is the trust boundary of the release; keep it
    # off self-hosted hardware the same way npm-publish is.
    runs-on: ubuntu-24.04
    # The server tarballs are part of the release: wait for them too.
    needs: [binaries, server-packages, windows-bundle, npm-publish]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      # agentbrowser-windows-x64.zip arrives from the windows-bundle job:
      # winget's single installer for all three Windows commands
      # (scripts/winget-manifests.mjs lists them as nested portable files).
      - name: Show the Windows bundle
        run: |
          # No pipe: a missing or corrupt zip must fail this step itself.
          unzip -l release-assets/agentbrowser-windows-x64.zip > bundle-listing.txt
          tail -n 3 bundle-listing.txt

      - name: Compute checksums
        run: |
          cd release-assets
          sha256sum agentbrowser-mcp-* agentbrowser-cli-* agentbrowser-server-* agentbrowser-windows-x64.zip > sha256sums.txt
          cat sha256sums.txt

      # R14 provenance: a Sigstore-signed SLSA build-provenance attestation for every asset
      # (binaries, server tarballs, the Windows zip and sha256sums.txt), bound to this workflow
      # run. Verify with: gh attestation verify <file> -R anvai-labs/agentbrowser
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-assets/*'

      - name: Write release notes
        run: |
          # Single-quoted heredoc: nothing expands, so the bun version below is
          # written literally. Keep it in sync with the pinned setup-bun above.
          cat > notes.md <<'EOF'
          ## AgentBrowser ${{ github.ref_name }}

          AgentBrowser ships a first-class CLI, a service and an optional MCP
          adapter. Point the CLI at a reachable service with `--base-url`, or set
          `AGENTBROWSER_BASE_URL` for MCP (default `http://localhost:5709`). The MCP
          executable is only the stdio adapter, not the service.
          See the [versioned changelog](https://github.com/anvai-labs/agentbrowser/blob/${{ github.ref_name }}/CHANGELOG.md)
          for included capabilities and qualification limits.

          The service is now installable too: `agentbrowser-server-<target>.tar.gz`
          is a self-contained server build (pruned production `node_modules` +
          compiled `dist/`) whose every artifact passed extracted-package acceptance:
          real Chromium navigation/snapshot/action, valid screenshot/PDF bytes,
          HTTP/TLS downloads, denial/cancellation controls and matching CLI/MCP calls.
          Stock-launcher default denial and instrumented snapshot recovery are
          distinct checks. This is not hostile-browser containment evidence.

          ```sh
          tar -xzf agentbrowser-server-<target>.tar.gz && ./server/agentbrowser-server
          # needs Node 22 or newer plus a compatible Chromium already installed under
          # PLAYWRIGHT_BROWSERS_PATH; the archive launcher does not download it.
          # Linux hosts must also provide Chromium's platform libraries.
          ```

          Homebrew users get the server, CLI and MCP in one command:
          `brew install anvai-labs/tap/agentbrowser`
          (`brew services start anvai-labs/tap/agentbrowser` runs the service).

          Windows users get all three in `agentbrowser-windows-x64.zip`
          (`winget install AnvaiLabs.AgentBrowser`, or extract the zip anywhere):
          `agentbrowser-server.exe` runs the service on the bundled Node.js
          runtime (`node\`) and downloads its Chromium on first start
          (`--install-browser` pre-provisions it).

          ```powershell
          agentbrowser-server --version
          agentbrowser-server            # first start downloads Chromium (~300 MB)
          ```

          ### Smoke coverage

          | Artifact | Stdio smoke |
          |---|---|
          | agentbrowser-mcp-darwin-arm64 | run natively on the build runner |
          | agentbrowser-mcp-darwin-x64 | run via Rosetta on the arm64 runner |
          | agentbrowser-mcp-linux-x64 | run natively on the build runner |
          | agentbrowser-mcp-linux-arm64 | run natively on the ARM build runner |
          | agentbrowser-mcp-windows-x64.exe | run natively on the build runner |

          The CLI (`agentbrowser-cli-<target>`) ships from this release too —
          `--version` and `--help` smoke-tested wherever the runner can execute it (same
          targets/omissions as the MCP binary).

          Each smoke ran `initialize` + `tools/list` against the compiled
          artifact and required the complete unbound catalog and the exact release version
          in `serverInfo`.

          Server acceptance uses Node 24.21.0 on native Linux x64/ARM and Darwin ARM.
          The Darwin x64 tarball is exercised on ARM Node with Rosetta x64 clients;
          this is not native Intel server-runtime proof. The Windows bundle was
          assembled and smoke-tested on a hosted Windows runner from a clean room
          outside the build checkout: first start, a real Chromium session through
          the CLI and MCP executables, launcher-kill cleanup, invocation through
          a symlink (winget's Links directory), and a first start that downloads
          Chromium itself.

          ### Install

          ```sh
          # verify against sha256sums.txt after download
          chmod +x agentbrowser-mcp-<target>
          ```

          ```yaml
          # ~/.victor/mcp.yaml - no Node, no repo checkout
          mcpServers:
            agentbrowser:
              command: /usr/local/bin/agentbrowser-mcp
              env:
                AGENTBROWSER_BASE_URL: http://localhost:5709
          ```

          Built with bun 1.4.0.
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          # Published bytes are immutable once repository immutable releases are on: assemble the
          # Release as a draft, upload every asset, then publish once. Duplicate asset names
          # fail closed; never replace an asset or rerun publication over a published release.
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file notes.md --draft
          gh release upload "$TAG" --repo "$REPO" release-assets/*
          gh release edit "$TAG" --repo "$REPO" --draft=false

  winget:
    name: Winget manifests (zip with MCP, CLI and server)
    # Generates winget-pkgs manifests for the Windows zip (all three portable
    # commands as nested files) and,
    # when WINGET_FORK_TOKEN is configured, opens the submission PR to
    # microsoft/winget-pkgs so any Windows user can:
    #   winget install AnvaiLabs.AgentBrowser
    # (installs agentbrowser-mcp, agentbrowser-cli and agentbrowser-server).
    # Manifests always upload as a workflow artifact for manual submission.
    # InstallerUrl must point at the PUBLIC release repo (anvai-labs), never
    # the private anvaiops remote — winget validates public reachability.
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.tool-versions'

      - name: Download windows release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p winget-assets && cd winget-assets
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern 'agentbrowser-windows-x64.zip'

      - name: Generate winget manifests
        run: |
          node scripts/winget-manifests.mjs \
            --version "${GITHUB_REF_NAME#v}" \
            --zip-file winget-assets/agentbrowser-windows-x64.zip \
            --out winget

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: winget/

      # Credential priority: GitHub App (org-fork push, no user credential, no
      # expiry churn) over a user PAT. NOTE the platform limit: a GitHub App
      # can only act where it is installed, and microsoft/winget-pkgs only
      # installs Microsoft's own apps — so the App path pushes the manifests
      # branch to anvai-labs/winget-pkgs and ATTEMPTS the PR, degrading to a
      # one-click compare link in the step summary. WINGET_FORK_TOKEN (user
      # PAT with public_repo) remains the only zero-click option.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.WINGET_APP_ID }}
          private-key: ${{ secrets.WINGET_APP_PRIVATE_KEY }}
          owner: anvai-labs
          repositories: winget-pkgs

      - name: Submit PR to microsoft/winget-pkgs
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          WINGET_FORK_TOKEN: ${{ secrets.WINGET_FORK_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          BRANCH="ab-agentbrowser-${VER}"
          TOKEN="$APP_TOKEN"
          if [ -z "$TOKEN" ]; then TOKEN="$WINGET_FORK_TOKEN"; fi
          if [ -z "$TOKEN" ]; then
            echo "::notice::No winget credential (WINGET_APP_ID/WINGET_APP_PRIVATE_KEY or WINGET_FORK_TOKEN) — manifests uploaded as artifact; submit manually from manifests/a/AnvaiLabs/AgentBrowser/${VER}/"
            exit 0
          fi
          set -euo pipefail
          export GH_TOKEN="$TOKEN"
          # The org fork exists; a no-op fork call keeps the PAT path self-healing.
          # Round-11/F7: surface a missing org fork instead of failing at clone.
          if ! gh repo fork microsoft/winget-pkgs --org anvai-labs --clone=false >/dev/null 2>&1; then
            if ! gh repo view anvai-labs/winget-pkgs >/dev/null 2>&1; then
              echo "::error::anvai-labs/winget-pkgs fork does not exist and could not be created. Create it once (gh repo fork microsoft/winget-pkgs --org anvai-labs) with an account authorized in the org."
              exit 1
            fi
          fi
          sleep 5
          rm -rf wpk
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/anvai-labs/winget-pkgs.git" wpk
          cd wpk
          git checkout -q -b "$BRANCH"
          DEST="manifests/a/AnvaiLabs/AgentBrowser/${VER}"
          mkdir -p "$DEST" && cp ../winget/*.yaml "$DEST/"
          git add "$DEST"
          git -c user.name="agentbrowser-release-bot" -c user.email="noreply@anvai-labs" \
            commit -qm "Add AnvaiLabs.AgentBrowser ${VER}"
          git push -q origin "$BRANCH"
          if gh pr create --repo microsoft/winget-pkgs --head "anvai-labs:${BRANCH}" \
            --title "Add AnvaiLabs.AgentBrowser ${VER}" \
            --body "Automated submission from anvai-labs/agentbrowser release ${GITHUB_REF_NAME}. One zip installer with three nested portable commands (agentbrowser-mcp, agentbrowser-cli, agentbrowser-server). SHA256 verified by CI."; then
            echo "winget-pkgs submission PR opened." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Winget submission ready — one click"
              echo "Manifests branch pushed to anvai-labs/winget-pkgs (\`${BRANCH}\`)."
              echo "The GitHub App cannot open PRs in microsoft/winget-pkgs (not installed there); open it here:"
              echo "https://github.com/microsoft/winget-pkgs/compare/master...anvai-labs:${BRANCH}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
