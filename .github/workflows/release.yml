name: Release

# Single-binary MCP distribution per TD-BROWSER-5: every v* tag builds the
# agentbrowser-mcp executable for five targets, smoke-gates the artifacts that
# can run on their build runner, and publishes them with checksums.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tag-guard:
    name: Tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The binary's serverInfo.version is stamped from package.json, so a tag
      # that disagrees with it ships a mislabeled artifact. Fail loudly instead.
      - name: Verify tag matches packages/mcp-server version
        run: |
          PKG_VERSION=$(node -p "require('./packages/mcp-server/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=${GITHUB_REF_NAME} package=${PKG_VERSION}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match packages/mcp-server version ${PKG_VERSION}. Bump the package in the release commit."
            exit 1
          fi

  binaries:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    needs: tag-guard
    strategy:
      fail-fast: false
      matrix:
        # smoke: whether the artifact can be executed on its build runner.
        # Cross-compiled targets that cannot run there are recorded in the
        # release notes instead of being silently skipped.
        include:
          - target: bun-darwin-arm64
            os: macos-latest
            artifact: agentbrowser-mcp-darwin-arm64
            smoke: true
          # GitHub retired the Intel macOS runners: the x64 build is
          # cross-compiled on the arm64 runner and smoke-tested through Rosetta.
          - target: bun-darwin-x64
            os: macos-latest
            artifact: agentbrowser-mcp-darwin-x64
            smoke: true
          - target: bun-linux-x64
            os: ubuntu-latest
            artifact: agentbrowser-mcp-linux-x64
            smoke: true
          # No arm64 Linux runners are available to private repos: the arm64
          # build is cross-compiled and its smoke is explicitly skipped.
          - target: bun-linux-arm64
            os: ubuntu-latest
            artifact: agentbrowser-mcp-linux-arm64
            smoke: false
          - target: bun-windows-x64
            os: windows-latest
            artifact: agentbrowser-mcp-windows-x64.exe
            smoke: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Workspace packages resolve each other through dist/; a clean checkout
      # has none. Same shape as the CI build job.
      - name: Build workspace dependencies
        run: pnpm -r build

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: the bun version is part of the build environment and is
          # recorded in the release notes. Bump deliberately, then re-verify.
          bun-version: '1.4.0'

      - name: Compile the binary (version-stamped)
        run: node packages/mcp-server/scripts/compile.mjs --target=${{ matrix.target }} --outfile=packages/mcp-server/dist-bin/${{ matrix.artifact }}

      - name: Stdio smoke (initialize + tools/list)
        if: ${{ matrix.smoke }}
        run: node packages/mcp-server/scripts/smoke.mjs packages/mcp-server/dist-bin/${{ matrix.artifact }}

      - name: Record the skipped smoke in the job log
        if: ${{ !matrix.smoke }}
        run: echo "::warning::Smoke SKIPPED for ${{ matrix.artifact }} - cross-compiled for a target with no runner. Recorded in the release notes."

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/mcp-server/dist-bin/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Checksums and GitHub Release
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute checksums
        run: |
          cd release-assets
          sha256sum agentbrowser-mcp-* > sha256sums.txt
          cat sha256sums.txt

      - name: Write release notes
        run: |
          BUN_VERSION="1.4.0"
          cat > notes.md <<'EOF'
          ## agentbrowser-mcp ${{ github.ref_name }}

          Single-binary MCP server distribution (TD-BROWSER-5). The binary is
          **only the MCP stdio adapter**: it still requires a reachable
          AgentBrowser server for anything beyond the protocol handshake.
          Deploy the server once (Docker image or `node packages/api/dist/bin.js`);
          every consumer process spawns the lightweight binary.

          ### Smoke coverage

          | Artifact | Stdio smoke |
          |---|---|
          | agentbrowser-mcp-darwin-arm64 | run natively on the build runner |
          | agentbrowser-mcp-darwin-x64 | run via Rosetta on the arm64 runner |
          | agentbrowser-mcp-linux-x64 | run natively on the build runner |
          | agentbrowser-mcp-linux-arm64 | **skipped** - cross-compiled; private repos have no arm64 Linux runners |
          | agentbrowser-mcp-windows-x64.exe | run natively on the build runner |

          Each smoke ran `initialize` + `tools/list` against the compiled
          artifact and required the full 6-tool catalog and a release version
          in `serverInfo`.

          ### Install

          ```sh
          # verify against sha256sums.txt after download
          chmod +x agentbrowser-mcp-<target>
          ```

          ```yaml
          # ~/.victor/mcp.yaml - no Node, no repo checkout
          mcpServers:
            agentbrowser:
              command: /usr/local/bin/agentbrowser-mcp
              env:
                AGENTBROWSER_BASE_URL: http://localhost:3000
          ```

          Built with bun ${BUN_VERSION}.
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          # Create-or-update keeps re-runs of the same tag idempotent.
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file notes.md
          gh release upload "$TAG" --repo "$REPO" release-assets/* --clobber
