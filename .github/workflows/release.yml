name: Release

# Single-binary MCP distribution per TD-BROWSER-5: every v* tag builds the
# agentbrowser-mcp executable for five targets, smoke-gates the artifacts that
# can run on their build runner, and publishes them with checksums.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tag-guard:
    name: Tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The binary's serverInfo.version is stamped from package.json, so a tag
      # that disagrees with it ships a mislabeled artifact. Fail loudly instead.
      - name: Verify tag matches packages/mcp-server version
        run: |
          PKG_VERSION=$(node -p "require('./packages/mcp-server/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=${GITHUB_REF_NAME} package=${PKG_VERSION}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match packages/mcp-server version ${PKG_VERSION}. Bump the package in the release commit."
            exit 1
          fi

  binaries:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    needs: tag-guard
    strategy:
      fail-fast: false
      matrix:
        # smoke: whether the artifact can be executed on its build runner.
        # Cross-compiled targets that cannot run there are recorded in the
        # release notes instead of being silently skipped.
        include:
          - target: bun-darwin-arm64
            os: macos-latest
            artifact: agentbrowser-mcp-darwin-arm64
            smoke: true
          # GitHub retired the Intel macOS runners: the x64 build is
          # cross-compiled on the arm64 runner and smoke-tested through Rosetta.
          - target: bun-darwin-x64
            os: macos-latest
            artifact: agentbrowser-mcp-darwin-x64
            smoke: true
          - target: bun-linux-x64
            os: ubuntu-latest
            artifact: agentbrowser-mcp-linux-x64
            smoke: true
          # No arm64 Linux runners are available to private repos: the arm64
          # build is cross-compiled and its smoke is explicitly skipped.
          - target: bun-linux-arm64
            os: ubuntu-latest
            artifact: agentbrowser-mcp-linux-arm64
            smoke: false
          - target: bun-windows-x64
            os: windows-latest
            artifact: agentbrowser-mcp-windows-x64.exe
            smoke: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Workspace packages resolve each other through dist/; a clean checkout
      # has none. Same shape as the CI build job.
      - name: Build workspace dependencies
        run: pnpm -r build

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: the bun version is part of the build environment and is
          # recorded in the release notes. Bump deliberately, then re-verify.
          bun-version: '1.4.0'

      - name: Compile the binary (version-stamped)
        run: node packages/mcp-server/scripts/compile.mjs --target=${{ matrix.target }} --outfile=packages/mcp-server/dist-bin/${{ matrix.artifact }}

      - name: Stdio smoke (initialize + tools/list)
        if: ${{ matrix.smoke }}
        run: node packages/mcp-server/scripts/smoke.mjs packages/mcp-server/dist-bin/${{ matrix.artifact }}

      - name: Record the skipped smoke in the job log
        if: ${{ !matrix.smoke }}
        run: echo "::warning::Smoke SKIPPED for ${{ matrix.artifact }} - cross-compiled for a target with no runner. Recorded in the release notes."

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/mcp-server/dist-bin/${{ matrix.artifact }}
          if-no-files-found: error

  server-packages:
    # TD-BROWSER-5 shipped only the MCP adapter; consumers still needed a repo
    # checkout for the service it drives. Each target is a self-contained
    # "fat tarball": the built API server plus its pruned production
    # node_modules (Playwright is bundler-hostile — its package tree must ship
    # intact, so no esbuild/bun single-file trick here). All four targets are
    # native builds, so every tarball gets the full browser smoke.
    name: Server ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: server-darwin-arm64
            os: macos-latest
          - target: server-darwin-x64
            # The fat tarball is pure JS plus a universal optional fsevents —
            # no arch-specific build step — and macos-13 runners starve
            # (see sandhi's release.yml). Build x64 on the arm64 runner.
            os: macos-latest
          - target: server-linux-x64
            os: ubuntu-latest
          - target: server-linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      - name: Deploy the API server with pruned production dependencies
        run: pnpm --filter @agentbrowser/api deploy --prod out/server

      - name: Stamp version and commit
        run: |
          node -p "JSON.stringify({ version: require('./packages/mcp-server/package.json').version, commit: process.env.GITHUB_SHA }, null, 2)" > out/server/VERSION.json

      - name: Bundle the generic launcher
        run: |
          # For non-Homebrew consumers: keeps the Playwright browser cache out
          # of the package tree and requires only `node` on PATH.
          cat > out/server/agentbrowser-server <<'LAUNCH'
          #!/bin/sh
          set -eu
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          : "${PLAYWRIGHT_BROWSERS_PATH:=${XDG_CACHE_HOME:-$HOME/.cache}/agentbrowser/browsers}"
          export PLAYWRIGHT_BROWSERS_PATH
          exec node "$HERE/dist/bin.js" "$@"
          LAUNCH
          chmod +x out/server/agentbrowser-server

      - name: Tar
        # matrix.target carries a server- prefix (it names the artifact);
        # strip it so the published file is agentbrowser-server-<target>.
        run: |
          FILE="agentbrowser-server-${{ matrix.target }}.tar.gz"
          FILE="${FILE/agentbrowser-server-server-/agentbrowser-server-}"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          tar -czf "$FILE" -C out server

      - name: Smoke — real browser session from the extracted tarball
        env:
          FILE: ${{ env.FILE }}
        run: |
          rm -rf /tmp/abserver && mkdir -p /tmp/abserver
          tar -xzf "$FILE" -C /tmp/abserver
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/browsers"
          # pnpm deploy keeps transitive deps under .pnpm; resolve the CLI there.
          PW_CLI="$(echo /tmp/abserver/server/node_modules/.pnpm/playwright@*/node_modules/playwright/cli.js)"
          node "$PW_CLI" install chromium
          /tmp/abserver/server/agentbrowser-server &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/openapi.json && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:3000/openapi.json
          SID="$(curl -fsS -X POST http://127.0.0.1:3000/v1/sessions -H 'content-type: application/json' -d '{"tenantId":"release-smoke"}' | node -e "process.stdin.on('data',d=>process.stdout.write(JSON.parse(d).sessionId))")"
          PID="$(curl -fsS -X POST http://127.0.0.1:3000/v1/sessions/$SID/pages -H 'content-type: application/json' -d '{}' | node -e "process.stdin.on('data',d=>process.stdout.write(JSON.parse(d).pageId))")"
          curl -fsS -X POST http://127.0.0.1:3000/v1/sessions/$SID/pages/$PID/navigate -H 'content-type: application/json' -d '{"url":"https://example.com"}' >/dev/null
          OBS="$(curl -fsS -X POST http://127.0.0.1:3000/v1/sessions/$SID/pages/$PID/observe -H 'content-type: application/json' -d '{}')"
          echo "$OBS" | grep -q '"title":"Example Domain"' || { echo "::error::observe did not return the expected page"; exit 1; }
          kill $SERVER_PID

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.FILE }}
          if-no-files-found: error

  npm-publish:
    name: npm (@anvailabs/agentbrowser-mcp)
    runs-on: ubuntu-latest
    # OIDC Trusted Publishing (ADR-014): the npm binding pins (repository
    # anvai-labs/agentbrowser, workflow release.yml, environment npm) — no
    # publish token exists anywhere to leak or rotate. id-token: write mints
    # the assertion; npm >= 11 speaks OIDC natively. The tarball is packed
    # with pnpm because the package carries workspace:* internal deps that
    # plain npm cannot resolve at pack time.
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Build (package + its workspace dependencies)
        run: pnpm install --frozen-lockfile && pnpm --filter @anvailabs/agentbrowser-mcp... build
      - name: Publish with npm (OIDC) — skip if this version is already on the registry
        # The bootstrap publish (bridging the Trusted-Publisher chicken-and-egg)
        # puts the first version up from a local token; a re-run or subsequent
        # release flow must not die on "already published" (same idempotency as
        # the crates job in the sibling repo).
        #
        # ADR-014: OIDC trusted publishing ONLY, via the documented
        # invocation: `npm publish --provenance` from the package directory
        # with NO other credential configured. The v1.7.1 failure ladder:
        # take 1 E404 — a stale ambient NODE_AUTH_TOKEN (injected from
        # outside the workflow; repo/env/org secret lists are empty) was
        # preferred by npm over OIDC and is dead. Take 2 ENEEDAUTH — token
        # emptied, but setup-node's .npmrc still carried `_authToken=`
        # (configured-but-empty ≠ absent). Take 3 ENEEDAUTH — userconfig
        # neutralized so zero auth existed, which proved npm never
        # auto-attempts the OIDC exchange on a bare publish: `--provenance`
        # is what enters the trusted-publisher flow, and with id-token: write
        # and no other credential the OIDC exchange IS the authentication.
        # The earlier pnpm-pack-then-publish-tarball flow is dropped:
        # provenance publishes from the package directory, and the package
        # has zero runtime deps (esbuild bundles everything into dist/), so
        # nothing needs workspace:* resolution at publish time.
        working-directory: packages/mcp-server
        env:
          NODE_AUTH_TOKEN: ''
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if curl -sf -A "agentbrowser-release" \
            "https://registry.npmjs.org/@anvailabs%2fagentbrowser-mcp" \
            | grep -q "\"${VERSION}\""; then
            echo "::notice::$VERSION already on npm — skipping publish (verify still runs)"
          else
            npm publish --access public --provenance
          fi
      - name: Verify the registry actually has this version
        # Enforced, never token-keyed (the sibling repo's lesson): check the
        # artifact, not the job's exit code.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5 6; do
            if curl -sf -A "agentbrowser-release" \
              "https://registry.npmjs.org/@anvailabs%2fagentbrowser-mcp" \
              | grep -q "\"${VERSION}\""; then
              echo "npm: @anvailabs/agentbrowser-mcp ${VERSION} live"
              exit 0
            fi
            echo "not visible yet (attempt ${attempt}/6); registry indexing lag"
            sleep 20
          done
          echo "::error::npm publish reported success but ${VERSION} is not on the registry"
          exit 1

  release:
    name: Checksums and GitHub Release
    runs-on: ubuntu-latest
    # The server tarballs are part of the release: wait for them too.
    needs: [binaries, server-packages, npm-publish]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute checksums
        run: |
          cd release-assets
          sha256sum agentbrowser-mcp-* agentbrowser-server-* > sha256sums.txt
          cat sha256sums.txt

      - name: Write release notes
        run: |
          # Single-quoted heredoc: nothing expands, so the bun version below is
          # written literally. Keep it in sync with the pinned setup-bun above.
          cat > notes.md <<'EOF'
          ## agentbrowser-mcp ${{ github.ref_name }}

          Single-binary MCP server distribution (TD-BROWSER-5). The binary is
          **only the MCP stdio adapter**: point it at a reachable AgentBrowser
          service via `AGENTBROWSER_BASE_URL` (default `http://localhost:3000`).

          The service is now installable too: `agentbrowser-server-<target>.tar.gz`
          is a self-contained server build (pruned production `node_modules` +
          compiled `dist/`) whose every artifact passed a real-browser smoke —
          create a session, navigate to example.com, observe semantic elements.

          ```sh
          tar -xzf agentbrowser-server-<target>.tar.gz && ./server/agentbrowser-server
          # needs node on PATH; browsers bootstrap on first run into
          # ${XDG_CACHE_HOME:-$HOME/.cache}/agentbrowser/browsers
          # (override with PLAYWRIGHT_BROWSERS_PATH)
          ```

          Homebrew users get both halves in one command:
          `brew install anvai-labs/tap/agentbrowser`
          (`brew services start anvai-labs/tap/agentbrowser` runs the service).

          ### Smoke coverage

          | Artifact | Stdio smoke |
          |---|---|
          | agentbrowser-mcp-darwin-arm64 | run natively on the build runner |
          | agentbrowser-mcp-darwin-x64 | run via Rosetta on the arm64 runner |
          | agentbrowser-mcp-linux-x64 | run natively on the build runner |
          | agentbrowser-mcp-linux-arm64 | **skipped** - cross-compiled; private repos have no arm64 Linux runners |
          | agentbrowser-mcp-windows-x64.exe | run natively on the build runner |

          Each smoke ran `initialize` + `tools/list` against the compiled
          artifact and required the full 9-tool catalog and a release version
          in `serverInfo`.

          ### Install

          ```sh
          # verify against sha256sums.txt after download
          chmod +x agentbrowser-mcp-<target>
          ```

          ```yaml
          # ~/.victor/mcp.yaml - no Node, no repo checkout
          mcpServers:
            agentbrowser:
              command: /usr/local/bin/agentbrowser-mcp
              env:
                AGENTBROWSER_BASE_URL: http://localhost:3000
          ```

          Built with bun 1.4.0.
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          # Create-or-update keeps re-runs of the same tag idempotent.
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file notes.md
          gh release upload "$TAG" --repo "$REPO" release-assets/* --clobber
