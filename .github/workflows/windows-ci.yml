name: Windows CI

# TD-BROWSER Windows gate. The Linux suites in ci.yml cover the product;
# this workflow owns the win32-specific failure classes that Linux CI
# cannot see, observed in production bring-ups (WSL interop on aiserver1,
# GitHub windows runners):
#
#   W1  Core MCP stdio spawn + handshake on win32.
#   W2  .cmd shim relaying — npm shims must be launched via cmd.exe /c;
#       a bash/WSL parent execing the shim directly parses batch as shell.
#   W3  Paths with spaces ("C:\Program Files\..." class).
#   W4  UNC working directories (\\wsl.localhost\... parents).
#   W5  PowerShell interop relay (powershell.exe -Command -> node).
#   W6  Engine browser discovery (system Chrome or PLAYWRIGHT_BROWSERS_PATH).
#
# Plus the standard build sanity on the windows toolchain (pnpm workspace
# builds, dist version verification) — the release matrix already compiles
# windows exes; this keeps the pre-release path honest between tags.
#
# Runner override: set repo variable CI_WINDOWS_RUNNER (e.g. a self-hosted
# box like aiserver1) to move this job off hosted runners.

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/LICENSE'
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    name: Windows gotchas + build
    runs-on: ${{ vars.CI_WINDOWS_RUNNER || 'windows-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages resolve each other through dist/, which does not
      # exist on a clean checkout. Build first, in topological order.
      - name: Build workspace dependencies
        run: pnpm -r build

      # W6 prefers system Chrome on end-user machines; hosted runners do not
      # ship it, so provision Playwright's Chromium the same way the release
      # smoke job does and pin the browsers path for engine discovery.
      - name: Provision Chromium (runner fallback browser)
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:RUNNER_TEMP\win-ci-browsers"
          pnpm --filter @agentbrowser/engine-playwright exec playwright install chromium
          "PLAYWRIGHT_BROWSERS_PATH=$env:PLAYWRIGHT_BROWSERS_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run the login-browser suite (headless)
        run: >
          pnpm --filter @agentbrowser/engine-playwright exec vitest run
          src/login-browser.test.ts
        env:
          # The login-browser suite runs headless (TD-BROWSER-16 phase 4);
          # this is the job that exercises the win32 code paths.
          AGENTBROWSER_LOGIN_HEADLESS: '1'

      - name: Verify built product versions
        run: pnpm release:artifacts

      # The Windows server ships as a symlink-free (hoisted) tree, because
      # Windows tar cannot extract pnpm's links. Build it with the release
      # packager, then extract and run it from RUNNER_TEMP — outside the
      # checkout, where v1.17.0's build-path bug went unseen — including a
      # real Chromium session against the browsers provisioned above.
      - name: Package and check the win32-x64 server tree
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $out = Join-Path $env:RUNNER_TEMP 'win32-server'
          node scripts/package-server.mjs --output-dir $out --target win32-x64 --expected-version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-win32-server-tree.mjs --zip (Join-Path $out 'agentbrowser-server-win32-x64.zip') --expected-version $version --session
          exit $LASTEXITCODE

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Same pin as release.yml: part of the build environment.
          bun-version: '1.4.0'

      # The release artifact itself: launcher + CLI + MCP exes, pinned Node,
      # and the server tree from the step above, with the shipped-path,
      # link and MAX_PATH gates applied during assembly.
      - name: Assemble the Windows bundle
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exes = Join-Path $env:RUNNER_TEMP 'win-bundle-exes'
          $launcher = Join-Path $exes 'launcher.exe'
          $cli = Join-Path $exes 'cli.exe'
          $mcp = Join-Path $exes 'mcp.exe'
          # One string per argument: pwsh splits `--outfile=(expr)` into two.
          node packages/api/scripts/compile-launcher.mjs --target=bun-windows-x64 "--outfile=$launcher"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node packages/cli/scripts/compile.mjs --target=bun-windows-x64 "--outfile=$cli"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node packages/mcp-server/scripts/compile.mjs --target=bun-windows-x64 "--outfile=$mcp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/assemble-windows-bundle.mjs --output-dir (Join-Path $env:RUNNER_TEMP 'win-bundle') --expected-version $version `
            --server-zip (Join-Path $env:RUNNER_TEMP 'win32-server\agentbrowser-server-win32-x64.zip') `
            --launcher $launcher --cli $cli --mcp $mcp
          exit $LASTEXITCODE

      # Clean room: the smoke runs from a copy outside the checkout, with no
      # node_modules on any parent path, against the extracted bundle — real
      # Chromium sessions through the shipped CLI and MCP executables, kill
      # cleanup, and invocation through a symlink (as winget's Links dir).
      # This replaces the non-blocking MCP end-to-end step: that test now
      # runs inside the smoke, blocking, against agentbrowser-mcp.exe.
      - name: Clean-room Windows bundle smoke
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $room = Join-Path $env:RUNNER_TEMP 'clean-room'
          New-Item -ItemType Directory $room -Force | Out-Null
          Copy-Item scripts/windows-bundle-smoke.mjs, scripts/windows-mcp-e2e.test.mjs $room
          Set-Location $room
          node windows-bundle-smoke.mjs --zip (Join-Path $env:RUNNER_TEMP 'win-bundle\agentbrowser-windows-x64.zip') `
            --expected-version $version --browsers $env:PLAYWRIGHT_BROWSERS_PATH --require-symlink
          exit $LASTEXITCODE

      - name: Windows gotcha gates (W1-W6)
        run: node --test scripts/windows-gotchas.test.mjs

