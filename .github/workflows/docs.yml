name: Deploy Documentation

# Publishes the mkdocs site (anvai-labs.github.io/agentbrowser) from main.
# Every PR builds the site as a preview gate (strict mode: warnings fail)
# without publishing: `build` and `deploy` are required checks on develop and
# main, so a path-filtered PR run would leave them missing and block merges of
# PRs that touch no docs (deploy is skipped on PRs, which satisfies the check).
# Pushes to main stay path-filtered: only docs changes republish the site.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'mkdocs-requirements.txt'
      - '.github/workflows/docs.yml'
      - 'scripts/check_brand_tokens.py'
      - 'scripts/test_check_brand_tokens.py'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deploys serialize on one group; PR preview builds get their own group per
  # PR so they never queue behind (or alongside) a Pages deployment.
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-revision-date-localized needs history for page timestamps.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.tool-versions'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned docs toolchain
        run: pip install -r mkdocs-requirements.txt

      # Shared family brand files are pinned; fail before building on drift.
      - name: Check family brand tokens
        run: python scripts/test_check_brand_tokens.py && python scripts/check_brand_tokens.py .

      - name: Build the site (strict — warnings fail)
        run: mkdocs build --strict

      - name: Validate every relative link in the source tree
        run: node scripts/check-doc-links.mjs .

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
