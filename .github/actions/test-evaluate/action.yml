name: AgentBrowser test evaluate
description: >-
  Evaluate caller-observed AgentBrowser test-case bundles offline with a pinned,
  checksum-verified release CLI, and write a JUnit report. Executes no tests and
  fetches no evidence.
inputs:
  version:
    description: AgentBrowser release tag providing the CLI, e.g. v1.27.2.
    required: true
  bundles:
    description: Newline-separated evaluation bundle files or directories (every *.json).
    required: true
  junit:
    description: JUnit output path.
    required: false
    default: agentbrowser-evaluate.xml
  reports-dir:
    description: >-
      Optional directory for the full JSON reports (mode 0600). They can contain
      sensitive caller data; keep them out of public artifacts.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Evaluate bundles
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_BUNDLES: ${{ inputs.bundles }}
        INPUT_JUNIT: ${{ inputs.junit }}
        INPUT_REPORTS_DIR: ${{ inputs.reports-dir }}
      run: node "$GITHUB_ACTION_PATH/evaluate.mjs"
