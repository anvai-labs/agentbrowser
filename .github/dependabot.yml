# Dependency update PRs target develop (the integration branch); releases
# promote them to main. Security updates are raised regardless of the
# version-update schedule once Dependabot alerts are enabled for the repo.
version: 2
updates:
  # pnpm workspace: the root lockfile covers every packages/* manifest.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly

  # mkdocs-requirements.txt (docs site build).
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      docs-toolchain:
        patterns: ['*']
