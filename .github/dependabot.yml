# Dependency update PRs target develop (the integration branch); releases
# promote them to main. Security updates are raised regardless of the
# version-update schedule once Dependabot alerts are enabled for the repo.
version: 2
updates:
  # pnpm workspace: the root lockfile covers every packages/* manifest.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Qualification-pinned: the Firefox egress evidence
      # (docs/evidence/firefox-egress-*.json) is recorded against an exact
      # driver; bumping it requires re-running docs/firefox-egress-gate.md.
      - dependency-name: puppeteer-core
      - dependency-name: '@puppeteer/browsers'
      # Types track the minimum supported Node (22), not the newest release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (native compiler) is a deliberate migration, not a bump.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # pixelmatch 8 changes the colour metric (YIQ -> OKLab), so stored visual
      # baselines' colorThreshold would report false regressions; move only with
      # a baseline format version bump.
      - dependency-name: pixelmatch
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      # The runtime is pinned to the Node LTS in .tool-versions; move majors
      # deliberately (Node 25+ also drops corepack, which the build uses).
      - dependency-name: node
        update-types: ['version-update:semver-major']
      # The Playwright image ships browsers for exactly one Playwright version:
      # it must move together with the npm `playwright` dependency, never alone.
      # Dependabot names docker deps by image name, without the registry.
      - dependency-name: playwright

  # mkdocs-requirements.txt (docs site build).
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      docs-toolchain:
        patterns: ['*']
